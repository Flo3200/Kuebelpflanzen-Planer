[project]
name = "kuebelplaner"
version = "0.1.0"
description = "Planungsplattform für die Abholung von Kübelpflanzen"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.13",
  "ortools>=9.10",
  "pillow>=10.3",
  "reportlab>=4.2",
  "qrcode>=7.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pytest-timeout>=2.3",
    "httpx2>=2.13.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
